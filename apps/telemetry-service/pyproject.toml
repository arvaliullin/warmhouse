[project]
name = "telemetry-service"
version = "0.1.0"
description = "Telemetry microservice for the smart home ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "telemetry_service"
module-root = "src"
